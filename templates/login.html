<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — CS 분석기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 36px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 20px;
    }

    input:focus { border-color: #4f8ef7; }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }

    button[type="submit"]:hover { background: #3a7de0; }

    .error {
      background: #fff0f0;
      border: 1px solid #ffc5c5;
      color: #c0392b;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📊 CS 분석기</div>
    <div class="subtitle">채널톡 컴플레인 분석 도구</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>

      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">로그인</button>
    </form>
  </div>
</body>
</html>
